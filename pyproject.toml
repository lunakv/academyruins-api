[project]
name = "academyruins-api"
version = "0.7.0"
description = ""
authors = [{ name = "Václav Luňák" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.135.1,<0.136",
    "boto3>=1.36.21,<2",
    "pydantic>=2.10.6,<3",
    "requests>=2.32.3,<3",
    "SQLAlchemy>=1.4.41,<2",
    "psycopg2-binary>=2.9.10,<3",
    "hjson>=3.1.0,<4",
    "beautifulsoup4>=4.13.3,<5",
    "thefuzz[speedup]>=0.22.1,<0.23",
    "tika>=2.6.0,<3",
    "alembic>=1.14.1,<2",
]

[project.scripts]
academyruins = "src.cli_scripts.run:app"

[dependency-groups]
dev = [
    "python-dotenv>=0.21.0,<0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
line-length = 120
extend-exclude = ["src/static/raw_docs"]

[tool.ruff.lint]
# pycodestyle, pyflakes and isort (previously flake8 + isort)
select = ["E", "W", "F", "I"]
